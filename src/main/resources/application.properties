# H2 file database -> data survives restarts (stored in ./data/aeroagri.mv.db)
spring.datasource.url=jdbc:h2:file:./data/aeroagri;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
server.port=8080
# how long a simulated scan takes (seconds)
aeroagri.scan-seconds=10
